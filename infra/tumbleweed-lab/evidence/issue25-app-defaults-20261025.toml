scope = "Native default browser/file client dispatch with literal operands and bounded native tool clients"
native_acceptance = false
native_build = false
package_build = false
vm_access = false
qmp_access = false
downloads = false
actual_gui_started = false

[source_contract]
upstream_commit = "a59d051f0e8080052216f6c7b9eb7e5928935ce8"
script_path = "ryoku/shell/scripts/ryoku-app"
script_sha256 = "430d43ccc83820c97c32fc9e62b4208231c0c8c15077b5acda34de0f158b5131"
script = "browser/files are no-argument role launches; terminal supports explicit -- PROGRAM argv; upstream reads desktop.json desktop.apps then legacy hypr.json apps"
inir = "shell/quickshell/inir/services/AppLauncher.qml exposes ryoku-app browser as the system-browser choice"
role_settings_owner = 180

[implementation]
browser_query = ["/usr/bin/setpriv", "--no-new-privs", "/usr/bin/xdg-mime", "query", "default", "x-scheme-handler/http"]
files_query = ["/usr/bin/setpriv", "--no-new-privs", "/usr/bin/xdg-mime", "query", "default", "inode/directory"]
launch = ["/usr/bin/setpriv", "--no-new-privs", "/usr/bin/gtk-launch", "--", "VALIDATED_DESKTOP_ID", "LITERAL_TARGET_OPERANDS"]
query_timeout_seconds = 3
query_stdout_limit_bytes = 4096
launch_timeout_seconds = 30
reap_budget_seconds = 1
rpm_requires = ["/usr/bin/xdg-mime", "/usr/bin/gtk-launch"]
identity = "Unchanged non-root matching real/effective IDs; no-new-privs; Quickshell crash variables removed; absolute working directory preserved"
id = "One UTF-8 desktop-file ID, optional single final LF; nonempty .desktop stem; no path separators, leading option, control/whitespace, multiple lines or oversized output"
argv = "No shell command string or Desktop Exec parser; optional -- followed by nonempty literal browser/files targets; existing terminal contract unchanged"
uri = "Rust passes original encoded URI and filename OS arguments without splitting, interpolation or double percent-encoding. Actual GFile/GTK URI delivery remains a native acceptance gate"
native_reference = "https://github.com/GNOME/gtk/blob/gtk-3-24/gtk/gtk-launch.c"
native_reference_contract = "Native GDesktopAppInfo lookup; each target enters g_file_new_for_commandline_arg then g_app_info_launch. Native launcher may await a D-Bus startup ping"
lifecycle = "Shared short-client runner retains previous navigation/lifecycle command deadlines. Nonblocking bounded query pipe, new owned process group, timeout SIGKILL before direct-child reaping and bounded reaper handoff"

