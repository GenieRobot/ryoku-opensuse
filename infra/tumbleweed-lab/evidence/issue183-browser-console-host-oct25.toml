progress = "ephemeral streaming shown only while running; timed GET refresh and relative POST303GET avoid form replay; cancellation/failure has no partial transcript or token usage"
compatibility = "existing uploaded-document indexing, recent answers, usage/status, bearer API/native Unix and scoped Ask authorization preserved"

[finding]
source = "former POST /login emitted the raw owner bearer as an HttpOnly SameSite host cookie"
sink = "a second service on the same loopback host at another port can receive the ambient cookie and replay its raw bearer"
references = ["https://www.rfc-editor.org/rfc/rfc6265.html#section-8.5", "https://www.rfc-editor.org/rfc/rfc9110.html#section-11.5"]
invariant = "another loopback origin must not receive ambient owner authority merely because the user visits it"
fix = "no cookie is issued or accepted; UI uses origin-scoped HTTP Basic for username owner/private browser.token; every browser mutation requires exact Origin; explicit owner/scoped bearer routes retain typed authority"
challenge = "unauthenticated same-origin form returns401 before execution, allowing a standard auth client to challenge/retry; restricted or invalid bearer never inherits browser authority"
upgrade = "web startup rotates browser.token; restart required on upgrade to invalidate any bearer leaked by the previous cookie implementation"
assumptions = "standards-conforming origin/protection-space client, no manual secret forwarding; owner filesystem/socket authority and privileged traffic inspection remain outside this cross-port threat"
review = "separate source-to-sink and bypass/compatibility passes; all delegation slots occupied; discovered and corrected missing standard-client POST challenge and preserved existing usage/status views"
verification_limit = "local handler/protocol evidence passes; actual browser engine unavailable without a download; browser/WebKit/packaged VM acceptance remains pending, not claimed verified"

