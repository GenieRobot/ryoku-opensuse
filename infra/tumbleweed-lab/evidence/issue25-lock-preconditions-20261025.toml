[contract]
problem = "Lock client previously had no compositor-identity check; a missing manager WAYLAND_DISPLAY could silently skip the unit via ConditionEnvironment"
client = "Refuse missing/empty WAYLAND_DISPLAY or HYPRLAND_INSTANCE_SIGNATURE before any command; preserve exact user systemctl start --wait and propagate nonzero start result"
unit = "Replace ConditionEnvironment with presence plus negated empty-value AssertEnvironment for both identities; no other lock/PAM or lifetime change"
assertions = ["WAYLAND_DISPLAY", "!WAYLAND_DISPLAY=", "HYPRLAND_INSTANCE_SIGNATURE", "!HYPRLAND_INSTANCE_SIGNATURE="]
semantics_reference = "https://www.freedesktop.org/software/systemd/man/257/systemd.unit.html#Conditions%20and%20Asserts"
semantics = "Condition failure skips; unmet assertion fails the start job, without necessarily putting the unit into failed state; expression environment comes from the manager during actual unit start"
scope_limit = "Packaged precondition/job reporting only; arbitrary user drop-ins, actual visible locker, PAM/password, suspend and locked-crash guarantees are not certified"
lock_unit_sha256 = "4c2532cfe7c5554addf9024d0a9a04824a275a5b18f8a4d1733d7965a8e1d339"

