[package]
name = "ryoku-automation"
description = "Rust-only project automation for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
wsl-lab = []

[dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "net"] }
ryoku-recovery = { path = "../suse/recovery", version = "0.1.0" }

[[bin]]
name = "vm-lab"
path = "src/lab/main.rs"

[[bin]]
name = "zypp-hook-probe"
path = "src/bin_zypp_hook_probe.rs"
