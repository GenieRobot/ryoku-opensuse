[package]
name = "ryoku-automation"
description = "Rust-only project automation for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
wsl-lab = []
issue19-lab = ["wsl-lab"]
issue20-lab = ["wsl-lab"]
issue21-lab = ["wsl-lab"]
issue22-lab = ["issue21-lab"]
issue24-lab = ["issue21-lab"]

[dependencies]
serde_json = "1"
sha2 = "0.10.9"
toml = "1.1.8"
quick-xml = "0.41.0"
zstd = "0.13.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[[bin]]
name = "vm-lab"
path = "src/lab/main.rs"

[[bin]]
name = "zypp-hook-probe"
path = "src/bin_zypp_hook_probe.rs"
