[package]
name = "ryoku-automation"
description = "Rust-only project automation for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
wsl-lab = []
issue19-lab = ["wsl-lab"]

[dependencies]
serde_json = "1"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[[bin]]
name = "vm-lab"
path = "src/lab/main.rs"

[[bin]]
name = "zypp-hook-probe"
path = "src/bin_zypp_hook_probe.rs"
