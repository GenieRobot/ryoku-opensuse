name: Disposable Tumbleweed VM lab

# Explicit dispatch on already authorized capacity. No cloud provisioning occurs.
on:
  workflow_dispatch:
    inputs:
      assets:
        description: Existing pinned lab asset directory on the cloud runner
        required: true
        default: /workspace/opensuse-vm

permissions:
  contents: read

jobs:
  vm:
    runs-on: [self-hosted, Linux, X64, ryoku-disposable-vm]
    timeout-minutes: 120
    env:
      RYOKU_LAB_AUTHORIZED: existing-cloud-workspace
      RYOKU_LAB_ASSETS: ${{ inputs.assets }}
      # Controlled fresh path: artifact upload never reads a caller-chosen path.
      RYOKU_LAB_RUN: /workspace/ryoku-lab-actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Rust automation
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust boundaries
        run: cargo test --workspace --all-features --locked
      - name: Create, inspect, recover and reset the real VM
        id: lab
        run: cargo run --locked --bin vm-lab -- run "$RYOKU_LAB_ASSETS" "$RYOKU_LAB_RUN"
      - name: Retain only sanitized evidence
        if: always() && steps.lab.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tumbleweed-lab-evidence
          # Rust writes only allowlisted key/value evidence here. Never glob logs,
          # SSH material, profiles or disks, including on failed/blocked runs.
          path: ${{ env.RYOKU_LAB_RUN }}/evidence.txt
          if-no-files-found: error
          retention-days: 14
