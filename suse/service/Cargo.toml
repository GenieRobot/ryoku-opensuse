[package]
name = "ryoku-service"
description = "Versioned typed service and narrow helper contract for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2 = "0.11"
ryoku-profiles = { version = "0.1.0", path = "../profiles" }
libc = "0.2"
ryoku-recovery = { version = "0.1.0", path = "../recovery" }
ryoku-snapper = { version = "0.1.0", path = "../snapper" }
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
