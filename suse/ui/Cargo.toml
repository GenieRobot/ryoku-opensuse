[package]
name = "ryoku-ui"
description = "Unprivileged Rust user interface for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gtk-ui = ["dep:gtk"]

[dependencies]
gtk = { package = "gtk4", version = "0.10", optional = true }
rustix = { version = "1.1.5", features = ["process"] }
ryoku-service = { version = "0.1.0", path = "../service" }
serde_json = "1"

[[bin]]
name = "ryoku-ui-gtk"
path = "src/bin/ui-gtk.rs"
required-features = ["gtk-ui"]

[lints]
workspace = true
