[package]
name = "ryoku-recovery"
description = "Recovery state and backend contract for Ryoku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1.1.5", features = ["fs", "process", "net", "thread"] }
linux-raw-sys = { version = "0.12.1", features = ["btrfs", "ioctl"] }

ryoku-snapper = { path = "../snapper", version = "0.1.0" }
ryoku-profiles = { path = "../profiles", version = "0.1.0" }
