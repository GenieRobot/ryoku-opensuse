# Disposable nested visual proof. No session target or environment importer.
monitor = , 1280x720, auto, 1
exec-once = /usr/bin/ryoku-session shell

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(98c379ff)
    col.inactive_border = rgba(30343bff)
}
decoration {
    rounding = 12
}
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = SUPER, SPACE, exec, /usr/bin/ryoku-session open launcher
bind = SUPER, Escape, exec, /usr/bin/ryoku-session open quicksettings
bind = SUPER, V, exec, /usr/bin/ryoku-session open clipboard
bind = SUPER, N, exec, /usr/bin/ryoku-session open notifications
bind = SUPER, comma, exec, /usr/bin/ryoku-session hub
bind = SUPER, Return, exec, /usr/bin/konsole
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, Escape, exit,
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
