# Hypridle 0.1.8 session policy for the packaged Ryoku Hyprland session.
# Route both idle and logind sleep locking through one lock command so a
# timeout or suspend cannot launch a second Hyprlock instance.
general {
    lock_cmd = pidof hyprlock || /usr/bin/hyprlock --config /usr/share/ryoku-opensuse/session/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
