# Native Hyprlang remains supported by the inspected Hyprland v0.56.2 parser.
# This isolated baseline never reads or replaces the user's compositor config.
monitor = , preferred, auto, 1
# Hyprland discards exec-once stdout/stderr; retain Rust activation failures.
exec-once = /usr/bin/systemd-cat --identifier=ryoku-session /usr/bin/ryoku-session activate

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(98c379ff)
    col.inactive_border = rgba(30343bff)
}
decoration {
    rounding = 12
}
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = SUPER, SPACE, exec, /usr/bin/ryoku-session open launcher
bind = SUPER, Escape, exec, /usr/bin/ryoku-session open quicksettings
bind = SUPER, V, exec, /usr/bin/ryoku-session open clipboard
bind = SUPER, N, exec, /usr/bin/ryoku-session open notifications
bind = SUPER, comma, exec, /usr/bin/ryoku-session hub
bind = SUPER, Return, exec, /usr/bin/konsole
bind = SUPER, E, exec, /usr/bin/dolphin
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER SHIFT, Escape, exit,
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
