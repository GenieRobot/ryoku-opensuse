# Minimal Ryoku lock surface based on the Hyprlock 0.9.6 configuration syntax.
# Reference: https://github.com/hyprwm/hyprlock/blob/v0.9.6/assets/example.conf
# Use a solid background; do not capture the pre-lock desktop as an image.
$font = Space Grotesk

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgb(24, 24, 37)
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    inner_color = rgb(49, 50, 68)
    outer_color = rgb(137, 180, 250)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 40
    font_family = $font
    position = 0, 72
    halign = center
    valign = center
}
