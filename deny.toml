[advisories]
version = 2

[licenses]
version = 2
# The canonical recovery serializer/hash dependency tree uses these standard
# permissive licenses, which are compatible with the repository's GPLv3 code.
allow = ["GPL-3.0-only", "MIT", "Apache-2.0", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
