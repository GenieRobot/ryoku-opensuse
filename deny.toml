[graph]
# Keep optional UI dependencies in the reviewed graph even for plain `cargo deny check` invocations.
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# GTK's target-lexicon build dependency adds the standard Apache LLVM exception.
# Keep this exact SPDX expression alongside the project's existing permissive set.
allow = ["GPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.93
# The security-fixed zstd chain declares BSD-3-Clause. Its three packaged
# LICENSE texts retain the redistribution and non-endorsement conditions;
# vendor archives preserve those notices. Limit this allowance to these
# reviewed fixed releases, without changing advisory policy.
exceptions = [
  { allow = ["BSD-3-Clause"], crate = "zstd@=0.14.3" },
  { allow = ["BSD-3-Clause"], crate = "zstd-safe@=8.2.0" },
  { allow = ["BSD-3-Clause"], crate = "zstd-sys@=2.1.2" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# gtk4-macros and glib-macros require syn 2, while futures-macro and the
# selected serde_derive require syn 3; these major versions cannot unify.
# Exempt only the exact older syn version from the duplicate-version lint.
skip = [
  { crate = "syn", version = "=2.0.119", reason = "GTK4 and its dependency graph require syn 2 while other direct transitive macros require syn 3; the major APIs cannot unify." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
